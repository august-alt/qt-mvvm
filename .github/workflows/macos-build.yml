name: MacOS

# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ master, develop ]    
  pull_request:
    branches: [ master, develop ]

jobs:
  build:
    runs-on: macos-latest
    strategy:
      max-parallel: 3

    steps:
    - uses: actions/checkout@v6.0.2

    - name: dependencies
      run: |
        brew install cmake qt6 ccache
        echo "Qt6 is installed to"
        echo $QTDIR
        
    - name: ccache timestamp
      id: ccache_cache_timestamp
      shell: cmake -P {0}
      run: |
        string(TIMESTAMP current_date "%Y-%m-%d-%H;%M;%S" UTC)
        message("::set-output name=timestamp::${current_date}")
        
    - name: ccache files
      uses: actions/cache@v5.0.5
      with:
        path: .ccache
        key: qtmvvm-macos-ccache-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
        restore-keys: |
          qtmvvm-macos-ccache-
          
    - name: Build
      env:
        CCACHE_DIR: $GITHUB_WORKSPACE/.ccache
        CCACHE_COMPRESS: "true"
        CCACHE_COMPRESSLEVEL: "6"
        CCACHE_MAXSIZE: "400M"
        QT_QPA_PLATFORM: offscreen
        CXX: clang++
        USE_CPP: 17
        CMAKE_CXX_STANDARD: 17
        LLVM_BC_GENERATOR: /usr/bin/clang++
        LDFLAGS: "-L/usr/local/opt/qt/lib"
        CPPFLAGS: "-I/usr/local/opt/qt/include"
      run: |
        echo 'export PATH="/usr/local/opt/qt/bin:$PATH"' >> /Users/runner/.bash_profile
        mkdir $GITHUB_WORKSPACE/build
        cd $GITHUB_WORKSPACE/build
        cmake -G Ninja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/usr/local/opt/qt ../
        cmake --build . --config Release -j4
        
    - name: Test
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        cd $GITHUB_WORKSPACE/build
        echo Running tests...
        ctest -j --quiet --output-on-failure
        echo Testing finished.

    - name: Upload test logs
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: TestReport.log
        path: ./build/Testing/Temporary/LastTest.log
        retention-days: 7
        overwrite: true
