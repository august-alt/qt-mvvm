name: Windows

# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ master, develop ]    

env:
  CCACHE_VERSION: 4.13.6

jobs:
  build:
    runs-on: windows-latest
    strategy:
      max-parallel: 3

    steps:

    - name: Checkout code
      uses: actions/checkout@v6.0.2

    - name: Download ccache
      id: ccache
      shell: cmake -P {0}
      run: |
        set(ccache_url "https://github.com/ccache/ccache/releases/download/v$ENV{CCACHE_VERSION}/ccache-$ENV{CCACHE_VERSION}-windows-x86_64.zip")
        file(DOWNLOAD "${ccache_url}" ./ccache.zip SHOW_PROGRESS)
        execute_process(COMMAND 7z e ccache.zip -aoa -bb3 -r ccache.exe)
        
    - name: ccache timestamp
      id: ccache_cache_timestamp
      shell: cmake -P {0}
      run: |
        string(TIMESTAMP current_date "%Y-%m-%d-%H;%M;%S" UTC)
        message("::set-output name=timestamp::${current_date}")
        
    - name: ccache files 
      uses: actions/cache@v5.0.5
      with:
        path: .ccache
        key: qtmvvm-win-ccache-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
        restore-keys: |
          qtmvvm-win-ccache-

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.10.3'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        dir: '${{github.workspace}}/'
        install-deps: 'false'
        setup-python: 'false'
        use-official: 'false'
        cache: 'true'
        cache-key-prefix: 'install-qt-action'

    - name: Find VS path
      shell: cmd
      run: |
        for /F "delims=" %%G IN ('vswhere -latest -property installationPath') DO set "_VSInstallationPath=%%G"
        echo Visual Studio found at: %_VSInstallationPath%
        >> %GITHUB_ENV% echo VSInstallationPath="%_VSInstallationPath%"

    - name: Build
      shell: cmd
      env:
        CCACHE_BASEDIR: $GITHUB_WORKSPACE
        CCACHE_DIR: $GITHUB_WORKSPACE/.ccache
        CCACHE_COMPRESS: "true"
        CCACHE_COMPRESSLEVEL: "6"
        CCACHE_MAXSIZE: "1000M"
        QT_QPA_PLATFORM: offscreen
      run: |
        call "%VSInstallationPath:"=%\VC\Auxiliary\Build\vcvars64.bat"
        set QTDIR=${{github.workspace}}\Qt\6.10.3\msvc2022_64
        echo QTDIR=%QTDIR%
        set PATH=%PATH%;%QTDIR%;%QTDIR%\bin;${{github.workspace}}
        mkdir ${{github.workspace}}\build
        cd ${{github.workspace}}\build
        cmake -G Ninja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded" -DCMAKE_C_COMPILER="cl.exe" -DCMAKE_CXX_COMPILER="cl.exe" ..
        cmake --build . --config Release -j4

    - name: Test
      env:
        QT_QPA_PLATFORM: offscreen        
      shell: cmd
      run: |
        call "%VSInstallationPath:"=%\VC\Auxiliary\Build\vcvars64.bat"
        set QTDIR=${{github.workspace}}\Qt\6.10.3\msvc2022_64
        set PATH=%PATH%;%QTDIR%;%QTDIR%\bin;${{github.workspace}}
        cd ${{github.workspace}}\build
        echo Running tests...
        ctest -j --quiet --output-on-failure
        echo Testing finished.

    - name: Upload test logs
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: TestReport.log
        path: ./build/Testing/Temporary/LastTest.log
        retention-days: ${{ case(github.retention_days < 7, github.retention_days, 7) }}
        overwrite: true
