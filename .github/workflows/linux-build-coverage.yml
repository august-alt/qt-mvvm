name: TestCoverage

# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
    branches: [ master, develop ]    

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 3

    steps:
    - uses: actions/checkout@v6.0.2

    - name: setup dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake cmake-extras ccache qt6-base-dev qt6-tools-dev-tools libqt6svg6 qt6-declarative-dev libx11-xcb1 libxkbcommon-dev lcov
        
    - name: ccache timestamp
      id: ccache_cache_timestamp
      shell: cmake -P {0}
      run: |
        string(TIMESTAMP current_date "%Y-%m-%d-%H;%M;%S" UTC)
        message("::set-output name=timestamp::${current_date}")
        
    - name: ccache files
      uses: actions/cache@v5.0.5
      with:
        path: .ccache
        key: qtmvvm-coverage-ccache-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
        restore-keys: |
          qtmvvm-coverage-ccache-

    - name: Build
      env:
        CCACHE_DIR: $GITHUB_WORKSPACE/.ccache
        CCACHE_COMPRESS: "true"
        CCACHE_COMPRESSLEVEL: "6"
        CCACHE_MAXSIZE: "400M"
        QT_QPA_PLATFORM: offscreen
      run: |
        mkdir $GITHUB_WORKSPACE/build
        cd $GITHUB_WORKSPACE/build
        cmake -G Ninja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Profile ../
        cmake --build . --config Profile -j4

    - name: Test
      env:
        QT_QPA_PLATFORM: offscreen        
      run: |
        cd $GITHUB_WORKSPACE/build
        echo Running tests...
        ctest -j --quiet --output-on-failure
        echo Testing finished.

    - name: Upload test logs
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: TestReport.log
        path: ./build/Testing/Temporary/LastTest.log
        retention-days: 7
        overwrite: true

    - name: Generate test coverage summary
      run: |
        cd $GITHUB_WORKSPACE/build

        lcov --rc geninfo_unexecuted_blocks=1 --capture --directory . --output-file coverage.info --ignore-errors inconsistent --ignore-errors unused --include "$GITHUB_WORKSPACE/source/*" --parallel 4
        SUMMARY=$(lcov --summary coverage.info --ignore-errors format,format --ignore-errors inconsistent,inconsistent)
        echo "$SUMMARY"

        if echo "$SUMMARY" | grep "lines" | grep -q "no data found"; then
        LINES_PERCENT=0
        LINES_HIT=0
        LINES_TOTAL=0
        else
        LINES_PERCENT=$(echo "$SUMMARY" | grep "lines" | grep -oP '\K[0-9.]+(?=%)')
        LINES_HIT=$(echo "$SUMMARY" | grep "lines" | grep -oP '\(\K[0-9]+(?= of)')
        LINES_TOTAL=$(echo "$SUMMARY" | grep "lines" | grep -oP 'of \K[0-9]+(?= lines)')
        fi

        echo "LCOV_LINES_HIT=$LINES_HIT" >> $GITHUB_ENV
        echo "LCOV_LINES_TOTAL=$LINES_TOTAL" >> $GITHUB_ENV
        echo "LCOV_LINES_PERCENT=$LINES_PERCENT" >> $GITHUB_ENV

        if echo "$SUMMARY" | grep "functions" | grep -q "no data found"; then
        FUNCTIONS_PERCENT="0"
        FUNCTIONS_HIT="0"
        FUNCTIONS_TOTAL="0"
        else
        FUNCTIONS_PERCENT=$(echo "$SUMMARY" | grep "functions" | grep -oP '\K[0-9.]+(?=%)')
        FUNCTIONS_HIT=$(echo "$SUMMARY" | grep "functions" | grep -oP '\(\K[0-9]+(?= of)')
        FUNCTIONS_TOTAL=$(echo "$SUMMARY" | grep "functions" | grep -oP 'of \K[0-9]+(?= functions)')
        fi
        
        echo "LCOV_FUNCTIONS_HIT=$FUNCTIONS_HIT" >> $GITHUB_ENV
        echo "LCOV_FUNCTIONS_TOTAL=$FUNCTIONS_TOTAL" >> $GITHUB_ENV
        echo "LCOV_FUNCTIONS_PERCENT=$FUNCTIONS_PERCENT" >> $GITHUB_ENV
        
        echo "Lines:     $LINES_HIT / $LINES_TOTAL ($LINES_PERCENT%)"
        echo "Functions: $FUNCTIONS_HIT / $FUNCTIONS_TOTAL ($FUNCTIONS_PERCENT%)"
        
    - name: Generate test coverage report
      run: |
        cd $GITHUB_WORKSPACE/build
        genhtml --quiet --demangle-cpp --parallel --ignore-errors inconsistent --ignore-errors corrupt -o coverage -- coverage.info

    - name: Upload the test coverage report
      uses: actions/upload-artifact@v7
      with:
        name: TestCoverageReport
        path: ./build/coverage/
        retention-days: 7
        overwrite: true

    - name: Create coverage badges
      uses: schneegans/dynamic-badges-action@v1.8.0
      with:
        auth: ${{ secrets.BADGE_GIST_SECRET }}
        gistID: 94f00e5f5924881793dfda0a598055fd
        filename: coverage_lines_badge.svg
        label: 'Coverage: Lines'
        message: ${{ env.LCOV_LINES_HIT }} of ${{ env.LCOV_LINES_TOTAL }} (${{ env.LCOV_LINES_PERCENT }}%)
        valColorRange: ${{ env.LCOV_LINES_PERCENT }}
        minColorRange: 0
        maxColorRange: 100

    - name: Create coverage badges
      uses: schneegans/dynamic-badges-action@v1.8.0
      with:
        auth: ${{ secrets.BADGE_GIST_SECRET }}
        gistID: 94f00e5f5924881793dfda0a598055fd
        filename: coverage_functions_badge.svg
        label: 'Coverage: Functions'
        message: ${{ env.LCOV_FUNCTIONS_HIT }} of ${{ env.LCOV_FUNCTIONS_TOTAL }} (${{ env.LCOV_FUNCTIONS_PERCENT }}%)
        valColorRange: ${{ env.LCOV_FUNCTIONS_PERCENT }}
        minColorRange: 0
        maxColorRange: 100
